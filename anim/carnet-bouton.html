<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Carnet de notes</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600&display=swap" rel="stylesheet">
<style>
  html,body{margin:0;width:100%;height:100%;overflow:hidden;background:transparent}
  body{font-family:Sora,system-ui,sans-serif}
  /* le bloc entier arrive avec un rebond, après un court délai */
  .bloc{position:absolute;inset:0;display:flex;align-items:flex-end;gap:10px;padding:6px 8px;box-sizing:border-box;
        transform-origin:70% 90%;opacity:0;animation:arrive .9s cubic-bezier(.34,1.56,.64,1) var(--delai,1.1s) forwards}
  @keyframes arrive{0%{opacity:0;transform:scale(.2) rotate(-25deg)}60%{opacity:1;transform:scale(1.08) rotate(4deg)}100%{opacity:1;transform:scale(1) rotate(0)}}
  .carnet{position:relative;width:128px;height:74px;flex:0 0 auto;transform:rotate(-5deg);transform-origin:50% 100%;
          animation:respire 5.2s ease-in-out 2.2s infinite}
  @keyframes respire{0%,100%{transform:rotate(-5deg) translateY(0)}50%{transform:rotate(-3deg) translateY(-3px)}}
  .carnet img{width:100%;height:100%;object-fit:contain;display:block}
  .stylo{position:absolute;right:-18px;bottom:-6px;width:58px;height:58px;transform:rotate(0deg)}
  .pill{display:inline-flex;align-items:center;gap:8px;background:#1F3A5F;color:#fff;border-radius:999px;
        padding:8px 14px 8px 14px;font-size:14px;font-weight:600;letter-spacing:.2px;white-space:nowrap;
        box-shadow:0 4px 12px rgba(27,36,48,.25);margin-bottom:4px}
  .pill span{font-size:17px;line-height:1}
  .titre{font-size:11px;color:#1B2430;background:rgba(255,255,255,.88);border-radius:6px;padding:2px 6px;margin-bottom:5px;display:inline-block;max-width:150px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .droite{display:flex;flex-direction:column;align-items:flex-start}
</style>
</head>
<body>
<div class="bloc" id="bloc">
  <div class="carnet">
    <img id="img" alt="">
    <svg class="stylo" viewBox="0 0 64 64" aria-hidden="true">
      <g transform="rotate(-40 32 32)">
        <rect x="27" y="4" width="10" height="38" rx="2" fill="#009944"/>
        <rect x="27" y="4" width="10" height="7" rx="2" fill="#1B2430"/>
        <polygon points="27,42 37,42 32,56" fill="#f3d9a4"/>
        <polygon points="30.5,50 33.5,50 32,56" fill="#1B2430"/>
        <rect x="30" y="12" width="4" height="26" rx="1" fill="rgba(255,255,255,.35)"/>
      </g>
    </svg>
  </div>
  <div class="droite">
    <div class="titre" id="titre"></div>
    <div class="pill">Carnet de notes <span>→</span></div>
  </div>
</div>
<script>
  var q = new URLSearchParams(location.search);
  var n = q.get('n') || '1';
  document.getElementById('img').src = 'https://meujesse.github.io/demos/nhood/carnet-mini-' + n + '.png';
  var t = q.get('titre'); var el = document.getElementById('titre');
  if (t) el.textContent = 'Note ' + n + ' · ' + t; else el.style.display = 'none';
  if (q.get('delai')) document.getElementById('bloc').style.setProperty('--delai', q.get('delai') + 's');
</script>
</body>
</html>
