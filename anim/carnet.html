<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Carnet</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Patrick+Hand&display=swap" rel="stylesheet">
<style>
  :root{
    --papier:#fbf8f0;
    --encre:#1b2430;
    --ligne:#cfdbe6;
    --marge:#d98a7f;
    --vert:#009944;
    --pas:38px;      /* l'interligne du cahier : tout ce qui est écrit s'y cale */
    --decal:30px;    /* recalé au chargement sur la ligne de base réelle du texte */
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{width:100%;height:100%;overflow:hidden;background:#e9e4da}
  body{
    display:flex;align-items:center;justify-content:center;
    font-family:'Patrick Hand',"Bradley Hand","Segoe Print",cursive;
    color:var(--encre);
  }
  .bureau{position:fixed;inset:0;background:
      radial-gradient(120% 90% at 50% 0%, #f3efe6 0%, #e3ddd1 55%, #d8d1c4 100%);}
  .carnet{
    position:relative;width:1000px;height:502px;
    background:var(--papier);
    border-radius:4px 10px 10px 4px;
    box-shadow:0 18px 44px rgba(27,36,48,.22), 0 2px 0 #efe9dc inset;
    display:flex;overflow:hidden;
  }
  .reliure{width:86px;flex:0 0 86px;position:relative;
    background:linear-gradient(90deg,#efe7d7 0%, #f7f2e8 60%, var(--papier) 100%);
    border-right:1px solid #e6dfd0;}
  .reliure i{position:absolute;left:30px;width:26px;height:26px;border-radius:50%;
    background:#e9e4da;box-shadow:inset 0 2px 3px rgba(0,0,0,.25), 0 1px 0 #fff;}
  .page{position:relative;flex:1;padding:34px 54px 28px 44px;}
  .page::before{  /* les lignes du cahier : une ligne au début de chaque période */
    content:"";position:absolute;inset:0;
    background:repeating-linear-gradient(to bottom,
      var(--ligne) 0, var(--ligne) 1px,
      transparent 1px, transparent var(--pas));
    background-position:0 var(--decal);
    opacity:.85;pointer-events:none;
  }
  .page::after{
    content:"";position:absolute;top:0;bottom:0;left:16px;width:2px;background:var(--marge);opacity:.5;
  }
  .contenu{position:relative;z-index:1}
  h1{  /* le titre occupe deux lignes du cahier : sa ligne de base tombe sur la deuxième */
    position:relative;font-weight:400;font-size:46px;line-height:calc(var(--pas) * 2);
    margin:0;letter-spacing:.3px;white-space:nowrap;
  }
  h1 .souligne{position:absolute;left:0;top:var(--sl,100%);height:9px;overflow:visible;pointer-events:none}
  p{font-size:27px;line-height:var(--pas);margin:0}
  .note{color:#4b5a68}
  .vert{color:var(--vert)}
  .schema{position:relative;z-index:1;display:block}
  .pied{position:absolute;right:30px;bottom:12px;font-size:19px;color:#8d9aa6;z-index:1}
  /* mode papier (?papier=1) : le texte est écrit dans Genially, la page ne garde que le support */
  body.papier .contenu{position:static}   /* le schéma se cale alors sur la page, pas sur le bloc de texte vide */
  body.papier .schema{position:absolute;left:44px;bottom:36px}
  body.papier .page::before{opacity:.95}
  .onglet{
    position:absolute;right:-1px;top:48px;background:var(--vert);color:#fff;
    font-size:19px;letter-spacing:.6px;padding:7px 18px 8px;border-radius:6px 0 0 6px;z-index:2;
  }
</style>
</head>
<body>
<div class="bureau"></div>
<div class="carnet">
  <div class="reliure" id="reliure"></div>
  <div class="page" id="page">
    <div class="onglet" id="onglet">NOTE 1 / 5</div>
    <div class="contenu" id="contenu"></div>
    <div class="pied">Mon carnet · séquence 1</div>
  </div>
</div>

<script>
// un trait de soulignement tracé « à la main », posé juste sous le titre
function souligne(largeur){
  const w = Math.round(largeur), h = 9;
  let d = 'M2,6';
  const n = 6;
  for (let i = 1; i <= n; i++){
    const x = 2 + (w - 6) * i / n;
    const y = 6 + (i % 2 ? -1.6 : 1.4) * (0.6 + Math.random() * 0.7);
    d += ' Q' + (x - (w - 6) / (2 * n)) + ',' + (y + (i % 2 ? -2 : 2)) + ' ' + x + ',' + y;
  }
  return '<svg class="souligne" width="' + w + '" height="' + h + '" viewBox="0 0 ' + w + ' ' + h + '">' +
    '<path d="' + d + '" fill="none" stroke="#009944" stroke-width="3.2" stroke-linecap="round" opacity=".9"/></svg>';
}

const PH = 'font-family="Patrick Hand"';
// schéma « intention / impact » : deux boîtes, et l'écart entre les deux
function schemaIntentionImpact(){
  const W = 780, H = 114;
  let s = '<svg class="schema" viewBox="0 0 ' + W + ' ' + H + '" width="' + W + '" height="' + H + '">';
  s += '<rect x="8" y="22" width="268" height="70" rx="12" fill="#eaf7ee" stroke="#009944" stroke-width="2.2"/>';
  s += '<text x="142" y="52" text-anchor="middle" ' + PH + ' font-size="24" fill="#1b2430">l’intention</text>';
  s += '<text x="142" y="78" text-anchor="middle" ' + PH + ' font-size="19" fill="#4b5a68">ce qu’on a voulu, ce qu’on a écrit</text>';
  s += '<rect x="504" y="22" width="268" height="70" rx="12" fill="#eaf7ee" stroke="#009944" stroke-width="2.2"/>';
  s += '<text x="638" y="52" text-anchor="middle" ' + PH + ' font-size="24" fill="#1b2430">l’impact</text>';
  s += '<text x="638" y="78" text-anchor="middle" ' + PH + ' font-size="19" fill="#4b5a68">ce que les gens vivent vraiment</text>';
  // la flèche, cassée au milieu : c'est l'écart
  s += '<path d="M284 57 L372 57" stroke="#1b2430" stroke-width="2.4" fill="none" stroke-linecap="round"/>';
  s += '<path d="M372 57 l10 -12 l14 24 l14 -24 l10 12" stroke="#b5453a" stroke-width="2.4" fill="none" stroke-linejoin="round"/>';
  s += '<path d="M420 57 L492 57" stroke="#1b2430" stroke-width="2.4" fill="none" stroke-linecap="round"/>';
  s += '<path d="M482 49 L494 57 L482 65" stroke="#1b2430" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>';
  s += '<text x="398" y="103" text-anchor="middle" ' + PH + ' font-size="19" fill="#b5453a">l’écart : c’est lui qu’on cherche</text>';
  s += '</svg>';
  return s;
}
// schéma « du stéréotype à la discrimination » : trois étapes, deux flèches
function schemaChemin(){
  const W = 780, H = 104;
  const et = [['le stéréotype','l’idée toute faite'],['le préjugé','le jugement qui en découle'],['la discrimination','l’acte : la conséquence']];
  let s = '<svg class="schema" viewBox="0 0 ' + W + ' ' + H + '" width="' + W + '" height="' + H + '">';
  et.forEach(function (e, i){
    const x = 6 + i * 276, fill = i === 2 ? '#fbe9e6' : '#eaf7ee', stroke = i === 2 ? '#b5453a' : '#009944';
    s += '<rect x="' + x + '" y="18" width="226" height="70" rx="12" fill="' + fill + '" stroke="' + stroke + '" stroke-width="2.2"/>';
    s += '<text x="' + (x + 113) + '" y="48" text-anchor="middle" ' + PH + ' font-size="24" fill="#1b2430">' + e[0] + '</text>';
    s += '<text x="' + (x + 113) + '" y="74" text-anchor="middle" ' + PH + ' font-size="18" fill="#4b5a68">' + e[1] + '</text>';
    if (i < 2){
      const a = x + 236;
      s += '<path d="M' + a + ' 53 L' + (a + 34) + ' 53" stroke="#1b2430" stroke-width="2.4" fill="none" stroke-linecap="round"/>';
      s += '<path d="M' + (a + 24) + ' 45 L' + (a + 36) + ' 53 L' + (a + 24) + ' 61" stroke="#1b2430" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>';
    }
  });
  s += '</svg>';
  return s;
}
// schéma « diversité des usages » : un seul lieu, trois façons de s'en servir
function schemaUsages(){
  const W = 780, H = 114;
  let s = '<svg class="schema" viewBox="0 0 ' + W + ' ' + H + '" width="' + W + '" height="' + H + '">';
  // la serre : un toit en verrière et des plantes
  s += '<path d="M30 92 L30 50 L95 18 L160 50 L160 92 Z" fill="#eaf7ee" stroke="#009944" stroke-width="2.2" stroke-linejoin="round"/>';
  s += '<path d="M62 92 L62 60 M95 92 L95 44 M128 92 L128 60" stroke="#009944" stroke-width="1.6" opacity=".7"/>';
  s += '<text x="95" y="110" text-anchor="middle" ' + PH + ' font-size="19" fill="#4b5a68">un seul lieu</text>';
  const usages = ['déjeuner', 'travailler', 'souffler'];
  usages.forEach(function (u, i){
    const y = 30 + i * 30;
    s += '<path d="M172 56 Q 260 ' + (56 + (y - 56) * 0.5) + ' 330 ' + y + '" stroke="#1b2430" stroke-width="2" fill="none" stroke-linecap="round"/>';
    s += '<path d="M320 ' + (y - 6) + ' L332 ' + y + ' L320 ' + (y + 6) + '" stroke="#1b2430" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>';
    s += '<text x="346" y="' + (y + 8) + '" ' + PH + ' font-size="24" fill="#1b2430">' + u + '</text>';
  });
  s += '<text x="560" y="64" ' + PH + ' font-size="21" fill="#009944">trois usages, trois publics</text>';
  s += '</svg>';
  return s;
}

// Les notes de la séquence 1, dans l'ordre du chemin. Les anciennes notions
// restent disponibles plus bas pour les séquences suivantes.
const NOTES = {
  'signal-faible': { n:1, titre:'Signal faible', corps:[
    "Un petit fait, presque rien : une porte qu’on te tient, un prénom qu’on écorche, une blague qui ne fait rire que la moitié de la table. Pris seul, il ne prouve rien. Noté, puis recoupé avec d’autres, il raconte quelque chose.",
    "<span class='vert'>Dans une enquête, on note d’abord. On conclut après.</span>",
    "<span class='note'>Chez Nhood, c’est avec ce genre de signaux que le baromètre DE&amp;I repère ce qui fonctionne et ce qui mérite d’être creusé.</span>"
  ]},
  'angle-mort': { n:2, titre:'Angle mort', corps:[
    "Ce qu’on ne voit plus quand on est dedans. Noé connaît le chemin « presque » : trois semaines suffisent pour que des habitudes deviennent invisibles, les bonnes comme les autres.",
    "<span class='vert'>Ton regard neuf voit encore ce que les autres ne regardent plus.</span>",
    "<span class='note'>C’est pour ça qu’on te demande d’être force de proposition : pendant quelques semaines, tu es la personne qui remarque.</span>"
  ]},
  'diversite-des-usages': { n:3, titre:'Diversité des usages', corps:[
    "Un même lieu ne sert pas à tout le monde de la même façon. La serre : pour déjeuner, pour travailler, pour souffler. La cuisine : pour rire, et pour dire ce qui tracasse.",
    "<span class='vert'>Avant de juger un lieu ou une règle, regarder qui s’en sert, et comment.</span>"
  ], schema:'usages' },
  'intention-impact': { n:4, titre:'Intention / impact', corps:[
    "L’intention, c’est ce qu’on a voulu : une politique écrite, quatre engagements. L’impact, c’est ce que les gens vivent et ressentent. Les deux ne coïncident pas toujours.",
    "<span class='vert'>Le baromètre mesure l’impact. Il ne juge pas les intentions.</span>"
  ], schema:'intention' },
  'non-inclusion': { n:5, titre:'Non-inclusion', corps:[
    "Rarement une volonté d’exclure. Plus souvent un fonctionnement qui laisse quelqu’un dehors sans que personne l’ait décidé : une réunion calée un jour de télétravail, une règle que seuls les anciens connaissent, une info qui ne circule qu’à la machine à café.",
    "<span class='vert'>Personne n’a voulu exclure. Et pourtant quelqu’un manque.</span>",
    "<span class='note'>Dans l’équipe de Leïla, c’est réglé par le fonctionnement : les réunions ne tombent jamais sur les jours de télétravail.</span>"
  ]},

  // --- notions des séquences 2 à 8 (réécrites le 2 nov. 2026 : définition claire, au sens du module,
  //     puis la phrase de la politique DE&I Nhood en vert, puis un repère concret) ---
  'diversite': { n:1, titre:'Diversité', corps:[
    "En entreprise, la diversité, c’est le fait que les personnes d’une même équipe sont différentes : par le genre, l’âge, l’origine sociale ou culturelle, le parcours scolaire, la situation de santé ou de handicap, la façon de vivre.",
    "<span class='vert'>Nhood s’engage à « accueillir et intégrer la diversité des individualités et des parcours » (engagement n° 3).</span>"
  ]},
  'stereotype': { n:1, titre:'Stéréotype', corps:[
    "Une idée toute faite sur un groupe (« les jeunes ne sont pas fiables », « les femmes sont moins techniques »), appliquée à une personne avant de la connaître. En entreprise, il pèse, directement ou non, sur la crédibilité accordée à une collègue pour une tâche, sur un recrutement, sur l’évolution d’un collaborateur.",
    "<span class='vert'>Principe clé de la politique DE&amp;I Nhood : la déconstruction des stéréotypes et des préjugés.</span>"
  ], schema:'chemin' },
  'vivre-ensemble': { n:2, titre:'Vivre-ensemble', corps:[
    "En entreprise, la manière dont le collectif s’adresse aux autres, écoute, réagit à une remarque déplacée, partage l’information.",
    "<span class='vert'>Engagement n° 1 de Nhood : une culture du vivre ensemble fondée sur l’éthique, le courage, l’exemplarité, le respect et la confiance.</span>",
    "<span class='note'>Chacun en est responsable, pas seulement le manager : le témoin d’une remarque aussi.</span>"
  ]},
  'egalite-professionnelle': { n:2, titre:'Égalité professionnelle', corps:[
    "Le même traitement pour les femmes et les hommes à chaque étape du parcours : recrutement, salaire, évolution, accès aux responsabilités, parole en réunion. Elle se mesure dans les faits, pas dans les intentions.",
    "<span class='vert'>Engagement n° 2 de Nhood : assurer l’égalité des genres en offrant un traitement juste et équitable tout au long du parcours professionnel.</span>"
  ]},
  'egalite-des-chances': { n:3, titre:'Égalité des chances', corps:[
    "Que l’accès à un poste, à une mission ou à une évolution dépende de ce que la personne sait faire, pas de son point de départ : origine sociale, école, quartier, réseau, santé.",
    "<span class='vert'>Engagement n° 3 de Nhood : accueillir la diversité des individualités et des parcours, pour l’égalité des chances dans l’emploi et le développement professionnel.</span>",
    "Cadre légal : dans les entreprises d’au moins 300 salariés, les recruteurs sont formés à la non-discrimination à l’embauche au moins tous les cinq ans (Code du travail, art. L1131-2). Chez Nhood : HRBP et managers formés au recrutement inclusif."
  ]},
  'equite': { n:4, titre:'Équité', corps:[
    "L’égalité, c’est donner la même chose à tout le monde. L’équité, c’est donner à chacun ce qu’il lui faut pour avoir les mêmes chances de réussir : un aménagement de poste, un délai en plus, une consigne écrite en plus de l’oral.",
    "<span class='vert'>Nhood s’engage à « un traitement juste et équitable tout au long du parcours professionnel » (engagement n° 2).</span>",
    "<span class='note'>Un aménagement n’est pas un privilège : sans lui, la personne ne pourrait pas faire son travail dans les mêmes conditions que les autres.</span>"
  ]},
  'inclusion': { n:5, titre:'Inclusion', corps:[
    "Faire en sorte que chacun puisse réellement participer, contribuer et évoluer, quelle que soit sa situation ou l’étape de vie qu’il traverse : parentalité, temps partiel, santé, fin de carrière.",
    "<span class='vert'>Engagement n° 4 de Nhood : garantir l’inclusion de toutes et tous grâce à un accompagnement adapté aux réalités de chaque étape de vie.</span>"
  ]}
};

const q = new URLSearchParams(location.search);
const cle = q.get('n') || 'signal-faible';
const N = NOTES[cle] || NOTES['signal-faible'];

document.getElementById('onglet').textContent = q.get('onglet') || ('NOTE ' + N.n + ' / 5');
if (q.get('s')) document.querySelector('.pied').textContent = 'Mon carnet · séquence ' + q.get('s');
// ?papier=1 : support seul (lignes, reliure, onglet, schéma) ; ?d=<px> cale la première ligne
const PAPIER = q.get('papier') === '1';
if (PAPIER) document.body.classList.add('papier');
// ?y=<px> place la feuille en haut (au lieu de la centrer), ?h=<px> change sa hauteur, ?st=<px> cale le schéma (mode papier)
const HAUT = q.get('h'), TOP = q.get('y');
if (HAUT) document.querySelector('.carnet').style.height = HAUT + 'px';
if (TOP !== null) { document.body.style.alignItems = 'flex-start'; document.querySelector('.carnet').style.marginTop = TOP + 'px'; }
if (q.get('fond') === '0') { document.querySelector('.bureau').style.display = 'none'; document.documentElement.style.background = 'transparent'; document.body.style.background = 'transparent'; }
let html = PAPIER ? '' : '<h1><span id="titre">' + N.titre + '</span></h1>';
if (!PAPIER) html += N.corps.map(function (l) { return '<p>' + l + '</p>'; }).join('');
if (N.schema === 'intention') html += schemaIntentionImpact();
if (N.schema === 'usages') html += schemaUsages();
if (N.schema === 'chemin') html += schemaChemin();
document.getElementById('contenu').innerHTML = html;
if (q.get('st')) { const sc = document.querySelector('.schema'); if (sc) { sc.style.top = q.get('st') + 'px'; sc.style.bottom = 'auto'; } }
if (q.get('sz')) { const sc = document.querySelector('.schema'); if (sc) { sc.style.transformOrigin = 'left top'; sc.style.transform = 'scale(' + q.get('sz') + ')'; } }

// les anneaux de la reliure
const rel = document.getElementById('reliure');
for (let y = 36; y < (HAUT ? Number(HAUT) - 22 : 480); y += 58){
  const i = document.createElement('i');
  i.style.top = y + 'px';
  rel.appendChild(i);
}

// Calage de l'écriture sur les lignes : on mesure la vraie ligne de base du
// texte une fois la police chargée, puis on pose les traits 2 px dessous.
// Le titre, plus gros, a sa propre ligne de base : on le décale (sans toucher
// au flux) pour qu'elle tombe elle aussi sur un trait.
function cale(){
  const page = document.getElementById('page');
  const pas = 38;
  if (PAPIER) {  // les lignes se posent là où Genially écrit : décalage fourni dans l'adresse
    const d = parseFloat(q.get('d') || '30');
    page.style.setProperty('--decal', (((d % pas) + pas) % pas).toFixed(2) + 'px');
    return;
  }
  const sonde = function (el){
    const s = document.createElement('span');
    s.style.cssText = 'display:inline-block;width:0;height:0;vertical-align:baseline';
    el.appendChild(s);
    const y = s.getBoundingClientRect().top - page.getBoundingClientRect().top;
    el.removeChild(s);
    return y;
  };
  const p = page.querySelector('p');
  const h1 = page.querySelector('h1');
  if (!p || !h1) return;
  h1.style.top = '0px';                      // recalage idempotent : on repart de zéro
  const baseP = sonde(p);
  let decal = (baseP + 2) % pas; if (decal < 0) decal += pas;
  page.style.setProperty('--decal', decal.toFixed(2) + 'px');
  const baseH = sonde(h1);
  let d = (baseP - baseH) % pas; if (d > pas / 2) d -= pas; if (d < -pas / 2) d += pas;
  h1.style.top = d.toFixed(2) + 'px';
  // le soulignement part de la ligne de base du titre et suit sa largeur réelle
  const t = document.getElementById('titre');
  const old = h1.querySelector('.souligne'); if (old) old.remove();
  const baseDansH1 = sonde(h1) - (h1.getBoundingClientRect().top - page.getBoundingClientRect().top);
  h1.style.setProperty('--sl', (baseDansH1 + 3).toFixed(2) + 'px');
  h1.insertAdjacentHTML('beforeend', souligne(t.getBoundingClientRect().width + 6));
}
if (document.fonts && document.fonts.ready) document.fonts.ready.then(cale); else cale();
window.addEventListener('load', cale);
</script>
</body>
</html>
