for (var c = 0; c < 3; c++){
  var el = document.createElement('img');
  el.alt = '';
  el.src = NUAGES[c % NUAGES.length];
  ciel.appendChild(el);
  var n = { el: el, larg: alea(150, 320) };
  n.x = alea(-0.3, 1.0) * LARG;
  n.y = alea(-6, 62);

  el.style.width = n.larg.toFixed(0) + 'px';
  el.style.opacity = alea(0.55, 0.9).toFixed(2);
  bancs.push(n);
}

var scene = document.getElementById('scene');
var N = 4;
var feuilles = [];
var W = window.innerWidth || 1200, H = window.innerHeight || 675;

function hasard(a, b){ return a + Math.random() * (b - a); }

function naissance(f, demarrage){
  // Les feuilles tombent des arbres : elles entrent par le haut, jamais en plein
  // milieu de l'ecran. Le vent les pousse ensuite vers la droite.
  f.x = hasard(-0.15, 0.85) * W;
  f.y = demarrage ? hasard(-0.3, 0.8) * H : hasard(-0.35, -0.08) * H;
  f.taille = hasard(16, 30);
  f.prise = hasard(0.75, 1.25);          // prise au vent
  f.chute = hasard(26, 46);              // vitesse de chute propre, en px/s
  f.oscT = hasard(2.6, 4.4);             // periode du balancement, lente
  f.oscA = hasard(5, 13);                // amplitude laterale, en px
  f.phase = hasard(0, 6.28);
  f.inclin = hasard(-18, 18);
  f.opac = hasard(0.78, 1);
  var i = Math.floor(Math.random() * SRC.length);
  if (f.el.getAttribute('data-i') !== String(i)) { f.el.src = SRC[i]; f.el.setAttribute('data-i', i); }
  f.el.style.width = f.taille.toFixed(1) + 'px';
  f.el.style.opacity = f.opac.toFixed(2);
}

for (var i = 0; i < N; i++){
  var img = document.createElement('img');
  img.alt = '';
  scene.appendChild(img);
  var f = { el: img };
  naissance(f, true);
  feuilles.push(f);
}

var t0 = performance.now(), dernier = t0;

function image(maintenant){
  var t = (maintenant - t0) / 1000;
  var dt = Math.min(0.05, (maintenant - dernier) / 1000);
  dernier = maintenant;

  // Rafales : deux sinusoides de periodes premieres entre elles, le vent ne se
  // repete donc pas de facon perceptible et retombe presque entre deux bourrasques.
  var vent = 0.34 + 0.34 * Math.sin(t / 6.3) + 0.22 * Math.sin(t / 2.9 + 1.7);
  if (vent < 0.05) vent = 0.05;

  for (var k = 0; k < feuilles.length; k++){
    var f = feuilles[k];
    var osc = Math.sin(t * 6.283 / f.oscT + f.phase);
    // la feuille descend d'abord, le vent la decale sur le cote
    f.x += (8 + 46 * vent) * f.prise * dt + osc * f.oscA * dt;
    f.y += f.chute * dt;
    // elle s'incline dans le sens du balancement, sans tourner sur elle-meme
    var angle = f.inclin + osc * 13 + vent * 9 * f.prise;
    f.el.style.transform = 'translate3d(' + f.x.toFixed(1) + 'px,' + f.y.toFixed(1) + 'px,0) '
      + 'rotate(' + angle.toFixed(1) + 'deg)';
    if (f.y > H + 50 || f.x > W + 60) naissance(f, false);
  }
  boucle = requestAnimationFrame(image);
}

var boucle = requestAnimationFrame(image);

window.addEventListener('resize', function(){ W = window.innerWidth; H = window.innerHeight; });

// On coupe quand l'onglet passe en fond : inutile de calculer pour personne.
document.addEventListener('visibilitychange', function(){
  if (document.hidden) { cancelAnimationFrame(boucle); }
  else { dernier = performance.now(); boucle = requestAnimationFrame(image); }
});

if (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches){
  cancelAnimationFrame(boucle);
  scene.style.display = 'none';
}


var t0 = performance.now(), dernier = t0;

function image(maintenant){
  var t = (maintenant - t0) / 1000;
  var dt = Math.min(0.05, (maintenant - dernier) / 1000);
  dernier = maintenant;

  for (var c = 0; c < bancs.length; c++){
    var n = bancs[c];
    n.x += n.v * dt;
    var monte = Math.sin(t / 11 + n.bascule) * 4;   // respiration tres lente
    n.el.style.transform = 'translate3d(' + n.x.toFixed(1) + 'px,' + (n.y + monte).toFixed(1) + 'px,0)';
    if (n.x > LARG + 40) { n.x = -n.larg - alea(20, 260); n.y = alea(-6, 62); }
  }

  var vent = 0.34 + 0.34 * Math.sin(t / 6.3) + 0.22 * Math.sin(t / 2.9 + 1.7);
  if (vent < 0.05) vent = 0.05;
  for (var k = 0; k < feuilles.length; k++){
    var f = feuilles[k];
    var osc = Math.sin(t * 6.283 / f.oscT + f.phase);
    f.x += (8 + 46 * vent) * f.prise * dt + osc * f.oscA * dt;
    f.y += f.chute * dt;
    var angle = f.inclin + osc * 13 + vent * 9 * f.prise;
    f.el.style.transform = 'translate3d(' + f.x.toFixed(1) + 'px,' + f.y.toFixed(1) + 'px,0) '
      + 'rotate(' + angle.toFixed(1) + 'deg)';
    if (f.y > H + 50 || f.x > W + 60) naissance(f, false);
  }
  boucle = requestAnimationFrame(image);
}

var boucle = requestAnimationFrame(image);
window.addEventListener('resize', function(){ W = window.innerWidth; H = window.innerHeight; LARG = W; });
document.addEventListener('visibilitychange', function(){
  if (document.hidden) { cancelAnimationFrame(boucle); }
  else { dernier = performance.now(); boucle = requestAnimationFrame(image); }
});
if (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches){
  cancelAnimationFrame(boucle);
  ciel.style.display = 'none'; scene.style.display = 'none';
}
</script>
