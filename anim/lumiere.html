<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Lumière Nhood</title>
<style>
  html,body{margin:0;height:100%;background:transparent;overflow:hidden}
  .scene{position:fixed;inset:0;pointer-events:none}
  /* Soleil rasant qui passe par la verrière : il respire, il ne clignote pas. */
  /* Pas de mix-blend-mode : un melange plein ecran se recompose a chaque image.
     On anime seulement l'opacite d'un degrade, ce qui reste sur la carte graphique. */
  .soleil{position:fixed;inset:0;will-change:opacity;
    background:
      radial-gradient(55% 40% at 72% 10%, rgba(255,247,219,.22), rgba(255,247,219,0) 72%),
      radial-gradient(40% 30% at 18% 6%, rgba(255,250,232,.16), rgba(255,250,232,0) 70%);
    animation:respire 13s ease-in-out infinite}
  @keyframes respire{0%,100%{opacity:.6}50%{opacity:1}}
  /* Poussières dans le faisceau. Très peu, très lentes : on les sent, on ne les regarde pas. */
  .grain{position:absolute;border-radius:50%;background:rgba(255,252,240,.75);
    will-change:transform,opacity}
  @keyframes derive{
    0%{transform:translate3d(0,0,0);opacity:0}
    12%{opacity:.55}
    88%{opacity:.4}
    100%{transform:translate3d(var(--dx),var(--dy),0);opacity:0}
  }
</style>
</head>
<body>
<div class="scene" id="scene"><div class="soleil"></div></div>
<script>
  var scene = document.getElementById('scene');
  var N = 6;
  for (var i = 0; i < N; i++) {
    var g = document.createElement('div');
    g.className = 'grain';
    var t = 1.5 + Math.random() * 2.5;
    g.style.width = g.style.height = t.toFixed(1) + 'px';
    g.style.left = (Math.random() * 100) + '%';
    g.style.top  = (10 + Math.random() * 70) + '%';
    g.style.setProperty('--dx', ((Math.random() * 2 - 1) * 9).toFixed(1) + 'vw');
    g.style.setProperty('--dy', (-6 - Math.random() * 14).toFixed(1) + 'vh');
    g.style.animation = 'derive ' + (18 + Math.random() * 16).toFixed(1) + 's linear '
                      + (-Math.random() * 25).toFixed(1) + 's infinite';
    scene.appendChild(g);
  }
  if (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
    document.querySelectorAll('.grain, .soleil').forEach(function(el){
      el.style.animation = 'none'; el.style.opacity = '0';
    });
  }
</script>
</body>
</html>
