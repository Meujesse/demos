<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Badges NHOODERS</title>
<!-- Badges du parcours Nhood DE&I : une lettre de NHOODERS par séquence.
     ?vue=badge&n=1      grand badge qui tourne (fond transparent, pensé pour 520 x 520)
     ?vue=collection&n=1 les 8 badges en ligne, débloqués jusqu'à n (fond transparent, pensé pour 1000 x 190)
     &attente=2  attendre 2 s avant de faire arriver la collection
     &theme=sombre  textes clairs pour un fond foncé
     &calme=1            pas d'arrivée animée (aperçu éditeur) -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@500;700;800;900&display=swap" rel="stylesheet">
<style>
:root{--vert:#009944;--vert2:#00b552;--fonce:#006b30;--nuit:#1b2430;--or:#f3c34a}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden;background:transparent;font-family:"Public Sans",Arial,sans-serif;color:var(--nuit)}
#scene{position:absolute;left:0;top:0;transform-origin:0 0}

/* ---------- grand badge ---------- */
.badge{width:520px;height:520px;position:relative}
.rayons{position:absolute;left:50%;top:44%;width:600px;height:600px;margin:-300px 0 0 -300px;border-radius:50%;
  background:repeating-conic-gradient(from 0deg,rgba(0,153,68,.16) 0 7deg,transparent 7deg 18deg);
  -webkit-mask:radial-gradient(circle,#000 22%,transparent 68%);mask:radial-gradient(circle,#000 22%,transparent 68%);
  animation:tourne 40s linear infinite;opacity:0}
.halo{position:absolute;left:50%;top:44%;width:330px;height:330px;margin:-165px 0 0 -165px;border-radius:50%;
  background:radial-gradient(circle,rgba(0,181,82,.35),rgba(0,181,82,0) 70%);opacity:0}
.piece{position:absolute;left:50%;top:44%;width:300px;height:300px;margin:-150px 0 0 -150px;perspective:1100px}
.coin{position:absolute;inset:0;transform-style:preserve-3d}
.face,.tranche{position:absolute;inset:0}
.face{backface-visibility:hidden;-webkit-backface-visibility:hidden}
.face svg,.tranche svg{width:100%;height:100%;display:block;overflow:visible}
.face{transform:translateZ(7px)}
.dos{transform:rotateY(180deg) translateZ(7px)}
.reflet{position:absolute;inset:0;-webkit-mask:var(--forme) center/100% 100% no-repeat;mask:var(--forme) center/100% 100% no-repeat;overflow:hidden}
.reflet:after{content:"";position:absolute;top:-20%;bottom:-20%;width:40%;left:-60%;
  background:linear-gradient(100deg,transparent,rgba(255,255,255,.55),transparent);transform:skewX(-12deg);animation:brille 5.5s ease-in-out infinite 2.2s}
.ruban{position:absolute;left:50%;top:75%;transform:translateX(-50%);opacity:0}
.ruban svg{display:block}
.etincelle{position:absolute;width:14px;height:14px;opacity:0}
.etincelle:before,.etincelle:after{content:"";position:absolute;left:50%;top:0;width:3px;height:100%;margin-left:-1.5px;border-radius:2px;background:#c8f2dc}
.etincelle:after{transform:rotate(90deg)}

.go .rayons{animation:apparait .8s ease-out .5s forwards,tourne 40s linear infinite}
.go .halo{animation:apparait .6s ease-out .4s forwards,pulse 3.2s ease-in-out 1.2s infinite}
.go .piece{opacity:0;animation:apparait .35s ease-out forwards}
.go .coin{animation:arrivee 2.6s cubic-bezier(.2,.75,.25,1) forwards,flotte 9s linear 2.6s infinite}
.go .ruban{animation:ruban .7s cubic-bezier(.3,1.6,.5,1) 1.7s forwards}
.go .etincelle{animation:etinc 1.4s ease-out forwards}
.calme .rayons,.calme .halo,.calme .ruban{opacity:1;animation:none}
.calme .coin{animation:flotte 9s linear infinite}

@keyframes tourne{to{transform:rotate(360deg)}}
@keyframes apparait{to{opacity:1}}
@keyframes pulse{50%{transform:scale(1.08);opacity:.75}}
@keyframes arrivee{0%{transform:scale(.1) rotateY(-900deg)}100%{transform:scale(1) rotateY(0deg)}}
@keyframes flotte{0%{transform:rotateY(0deg)}30%{transform:rotateY(0deg)}55%{transform:rotateY(180deg)}70%{transform:rotateY(180deg)}95%,100%{transform:rotateY(360deg)}}
@keyframes ruban{from{opacity:0;transform:translateX(-50%) scale(.4)}to{opacity:1;transform:translateX(-50%) scale(1)}}
@keyframes brille{0%,70%{left:-60%}100%{left:130%}}
@keyframes etinc{0%{opacity:0;transform:translate(0,0) scale(.2) rotate(0)}25%{opacity:1}100%{opacity:0;transform:translate(var(--dx),var(--dy)) scale(1) rotate(160deg)}}

/* ---------- collection ---------- */
.collec{width:1000px;height:190px;display:flex;gap:14px;align-items:flex-start;justify-content:center;padding-top:6px}
.case{width:108px;display:flex;flex-direction:column;align-items:center;gap:8px}
.mini{width:96px;height:96px;position:relative}
.mini svg{width:100%;height:100%;display:block;overflow:visible}
.case .nom{font-size:13px;font-weight:700;line-height:1.2;text-align:center;min-height:32px;color:var(--nuit)}
.case.ferme .nom{color:#8a959e;font-weight:600}
.case.actuel .mini{animation:respire 2.4s ease-in-out infinite}
.case.actuel .nom{color:var(--fonce)}
.go .case{opacity:0;transform:translateY(10px);animation:monte .5s ease-out forwards}
.go .case.actuel .mini{animation:tampon .7s cubic-bezier(.3,1.7,.5,1) both,respire 2.4s ease-in-out 1.6s infinite}
@keyframes monte{to{opacity:1;transform:none}}
@keyframes respire{50%{transform:scale(1.06)}}
@keyframes tampon{0%{transform:scale(2.2) rotate(-14deg);opacity:0}60%{opacity:1}100%{transform:scale(1) rotate(0)}}
/* thème sombre : posé sur un voile foncé dans Genially */
.sombre .case .nom{color:#fff}
.sombre .case.ferme .nom{color:rgba(255,255,255,.55)}
.sombre .case.actuel .nom{color:#7fe0a8}
.sombre .rayons{background:repeating-conic-gradient(from 0deg,rgba(127,224,168,.2) 0 7deg,transparent 7deg 18deg)}
@media (prefers-reduced-motion: reduce){*{animation-duration:.01s!important;animation-iteration-count:1!important}}
</style>
</head>
<body>
<div id="scene"></div>
<script>
const Q = new URLSearchParams(location.search);
const VUE = Q.get('vue') || 'badge';
const N = Math.max(1, Math.min(8, +(Q.get('n') || 1)));
const CALME = Q.get('calme') === '1';
const SOMBRE = Q.get('theme') === 'sombre';
if (SOMBRE) document.documentElement.classList.add('sombre');

// Les huit lettres, en minuscules comme le logo Nhood : ensemble elles écrivent « nhooders ».
// Les noms des séquences 2 à 8 restent cachés tant que le badge n'est pas gagné.
const B = [
  {l:'n', nom:'Nouveau regard', forme:'cercle'},
  {l:'h', nom:'Huit leviers',   forme:'cercle'},
  {l:'o', nom:'Œil ouvert',     forme:'cercle'},
  {l:'o', nom:'Oser intervenir',forme:'cercle'},
  {l:'d', nom:'',               forme:'cercle'},
  {l:'e', nom:'',               forme:'cercle'},
  {l:'r', nom:'',               forme:'cercle'},
  {l:'s', nom:'',               forme:'cercle'}
];
// Charte Nhood : rond en dégradé de deux verts à +45°, dessin au trait blanc arrondi (comme les pictos maison),
// lettres monolignes à bouts ronds dessinées sur le modèle du logotype.
const VERT1 = '#009944', VERT2 = '#73c69c';
const LOGO_BLANC = '../nhood/logo-nhood-blanc.png';

function forme(f, r) { return `M${100 - r},100a${r},${r} 0 1,0 ${2 * r},0a${r},${r} 0 1,0 ${-2 * r},0Z`; }

// Lettres au trait, hauteur d'x de 74 à 134 (les ascendantes montent à 46), centrées sur 100
const GLYPHE = {
  n: 'M72 134V104A28 28 0 0 1 128 104V134',
  h: 'M72 46V134M72 104A28 28 0 0 1 128 104V134',
  o: 'M100 76A28 28 0 1 1 99.9 76Z',
  d: 'M100 76A28 28 0 1 0 100.1 76ZM128 46V134',
  e: 'M72 105H128A28 28 0 1 0 120 125',
  r: 'M80 134V106A28 28 0 0 1 120 81',
  s: 'M124 86C119 79 111 76 101 76C88 76 78 82 78 92C78 113 124 98 124 120C124 129 114 135 100 135C89 135 80 131 75 123'
};
// décalage vertical pour centrer optiquement (les lettres à ascendante descendent un peu moins)
const DY = {n: -8, h: -2, o: -8, d: -2, e: -8, r: -8, s: -8};

function face(b, i, opts) {
  const id = 'g' + i + (opts.suffix || '');
  const glyphe = `<path d="${GLYPHE[b.l]}" transform="translate(0 ${DY[b.l]})" fill="none" stroke-linecap="round" stroke-linejoin="round"`;
  if (!opts.on) return `<svg viewBox="0 0 200 200">
    <circle cx="100" cy="100" r="88" fill="${SOMBRE ? 'rgba(255,255,255,.06)' : '#f1f5f2'}" stroke="${SOMBRE ? 'rgba(255,255,255,.38)' : '#c4ccc7'}" stroke-width="4" stroke-dasharray="2 9" stroke-linecap="round"/>
    ${glyphe} stroke="${SOMBRE ? 'rgba(255,255,255,.28)' : '#cfd8d2'}" stroke-width="14"/>
    <g transform="translate(150 150)"><circle r="17" fill="${SOMBRE ? '#2b4a3b' : '#fff'}" stroke="${SOMBRE ? 'rgba(255,255,255,.5)' : '#c4ccc7'}" stroke-width="2"/>
      <rect x="-7" y="-3" width="14" height="11" rx="2.5" fill="${SOMBRE ? 'rgba(255,255,255,.8)' : '#8a959e'}"/><path d="M-4.5 -3v-3a4.5 4.5 0 0 1 9 0v3" fill="none" stroke="${SOMBRE ? 'rgba(255,255,255,.8)' : '#8a959e'}" stroke-width="2.4"/></g></svg>`;
  const defs = `<defs><linearGradient id="${id}a" x1="0" y1="1" x2="1" y2="0"><stop offset="0" stop-color="${VERT1}"/><stop offset="1" stop-color="${VERT2}"/></linearGradient></defs>`;
  const disque = `<circle cx="100" cy="100" r="92" fill="url(#${id}a)"/><circle cx="100" cy="100" r="80" fill="none" stroke="#fff" stroke-opacity=".45" stroke-width="2.5"/>`;
  if (opts.dos) return `<svg viewBox="0 0 200 200">${defs}${disque}
    <image href="${LOGO_BLANC}" x="45" y="64" width="110" height="26"/>
    <text x="100" y="126" text-anchor="middle" font-family="Public Sans,Arial" font-weight="800" font-size="26" fill="#fff">${i + 1} / 8</text>
    <text x="100" y="148" text-anchor="middle" font-family="Public Sans,Arial" font-weight="600" font-size="12.5" fill="#fff" fill-opacity=".92">Séquence ${i + 1}</text></svg>`;
  return `<svg viewBox="0 0 200 200">${defs}${disque}
    ${glyphe} stroke="#000" stroke-opacity=".12" stroke-width="${opts.mini ? 19 : 17}" transform="translate(2 ${DY[b.l] + 3})"/>
    ${glyphe} stroke="#fff" stroke-width="${opts.mini ? 19 : 17}"/></svg>`;
}

const svgUrl = s => `url("data:image/svg+xml;utf8,${encodeURIComponent(s)}")`;

function vueBadge() {
  const b = B[N - 1], i = N - 1;
  const sc = document.getElementById('scene');
  const tranche = Array.from({length: 14}, (_, k) => `<div class="tranche" style="transform:translateZ(${(k - 6.5) * .9}px)"><svg viewBox="0 0 200 200"><path d="${forme(b.forme, 92)}" fill="${k % 2 ? '#008a3d' : '#2fae6b'}"/></svg></div>`).join('');
  const masque = svgUrl(`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200"><path d="${forme(b.forme, 92)}"/></svg>`);
  const etinc = Array.from({length: 14}, (_, k) => { const a = k / 14 * 2 * Math.PI + .2, d = 170 + (k % 3) * 40;
    return `<i class="etincelle" style="left:${260 - 7}px;top:${229 - 7}px;--dx:${(Math.cos(a) * d).toFixed(0)}px;--dy:${(Math.sin(a) * d).toFixed(0)}px;animation-delay:${(1.5 + (k % 4) * .08).toFixed(2)}s;transform:scale(${.6 + (k % 3) * .25})"></i>`; }).join('');
  sc.innerHTML = `<div class="badge ${CALME ? 'calme' : 'go'}" id="b">
    <div class="rayons"></div><div class="halo"></div>
    <div class="piece"><div class="coin">
      ${tranche}
      <div class="face">${face(b, i, {on: true})}<div class="reflet" style="--forme:${masque}"></div></div>
      <div class="face dos">${face(b, i, {on: true, dos: true, suffix: 'd'})}</div>
    </div></div>
    <div class="ruban"><svg width="340" height="64" viewBox="0 0 340 64">
      <defs><linearGradient id="rb" x1="0" y1="1" x2="1" y2="0"><stop offset="0" stop-color="${VERT1}"/><stop offset="1" stop-color="${VERT2}"/></linearGradient></defs>
      <rect x="6" y="6" width="328" height="52" rx="26" fill="${SOMBRE ? '#fff' : 'url(#rb)'}"/>
      <text x="170" y="40" text-anchor="middle" font-family="Public Sans,Arial" font-weight="800" font-size="23" fill="${SOMBRE ? '#00873c' : '#fff'}" letter-spacing=".5">${b.nom}</text>
    </svg></div>
    ${CALME ? '' : etinc}
  </div>`;
  fit(520, 520);
}

function vueCollection() {
  const A = parseFloat(Q.get('attente') || '0') || 0; // secondes avant l'arrivée des badges
  const sc = document.getElementById('scene');
  sc.innerHTML = `<div class="collec ${CALME ? '' : 'go'}">${B.map((b, i) => {
    const on = i < N, cls = (on ? '' : 'ferme') + (i === N - 1 ? ' actuel' : '');
    const d0 = A + i * .09, d1 = A + .5 + i * .09;
    return `<div class="case ${cls}" style="animation-delay:${d0.toFixed(2)}s"><div class="mini" style="animation-delay:${d1.toFixed(2)}s,${(d1 + .8).toFixed(2)}s">${face(b, i, {on, mini: true, suffix: 'm'})}</div><div class="nom">${on ? b.nom : 'À débloquer'}</div></div>`;
  }).join('')}</div>`;
  fit(1000, 190);
}

function fit(w, h) {
  const go = () => { const W = document.documentElement.clientWidth || innerWidth, H = document.documentElement.clientHeight || innerHeight; if (!W || !H) return;
    const k = Math.min(W / w, H / h), s = document.getElementById('scene');
    s.style.width = w + 'px'; s.style.height = h + 'px';
    s.style.transform = `scale(${k})`; s.style.left = ((W - w * k) / 2) + 'px'; s.style.top = ((H - h * k) / 2) + 'px'; };
  addEventListener('resize', go); go();
  if (window.ResizeObserver) new ResizeObserver(go).observe(document.documentElement);
  let n = 0; const t = setInterval(() => { go(); if (++n > 20) clearInterval(t); }, 250);
}

(VUE === 'collection' ? vueCollection : vueBadge)();
</script>
</body>
</html>
