<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><title>Travelling</title>
<style>
html,body{margin:0;height:100%;overflow:hidden;background:transparent}
#cadre{position:fixed;inset:0;overflow:hidden}
#img{position:absolute;left:0;top:0;width:100%;height:100%;object-fit:fill;transform-origin:0 0;will-change:transform}
</style></head><body><div id="cadre"><img id="img" alt=""></div>
<script>
// Travelling continu : on part d'un cadrage (from) et on glisse vers un autre (to), en % de l'image.
// Paramètres : img=URL, from=x,y,w,h, to=x,y,w,h, d=durée ms, delay=ms, ease=in-out|out
var q=new URLSearchParams(location.search), img=document.getElementById('img');
img.src=q.get('img')||'';
var from=(q.get('from')||'0,0,100,100').split(',').map(Number), to=(q.get('to')||'20,14,62,62').split(',').map(Number);
var d=Number(q.get('d')||6000), delay=Number(q.get('delay')||300);
var ease=q.get('ease')==='out'?'cubic-bezier(.2,.7,.2,1)':'cubic-bezier(.45,.05,.2,1)';
function tf(r){var s=100/r[2];var W=innerWidth,H=innerHeight;return 'translate('+(-r[0]/100*W*s)+'px,'+(-r[1]/100*H*s)+'px) scale('+s+')';}
function pose(){img.style.transition='none';img.style.transform=tf(from);}
pose();
var parti=false;
function partir(){if(parti)return;parti=true;pose();requestAnimationFrame(function(){setTimeout(function(){img.style.transition='transform '+d+'ms '+ease;img.style.transform=tf(to);},delay);});}
// départ robuste : image déjà en cache (load déjà passé), ou pas encore chargée, ou iframe remontée par le lecteur
if(img.complete&&img.naturalWidth)partir();else{img.addEventListener('load',partir);setTimeout(partir,1500);}
addEventListener('resize',function(){img.style.transition='none';img.style.transform=tf(to);});

if(q.get('debug')){var dbg=document.createElement('div');dbg.style.cssText='position:fixed;left:8px;top:8px;background:#000c;color:#0f0;font:12px monospace;padding:6px;z-index:9;white-space:pre';document.body.appendChild(dbg);
  setInterval(function(){dbg.textContent='complete='+img.complete+' nat='+img.naturalWidth+'x'+img.naturalHeight+'\ninner='+innerWidth+'x'+innerHeight+' parti='+parti+'\ntf='+img.style.transform.slice(0,60)+'\ntr='+img.style.transition.slice(0,40)+'\nvis='+document.visibilityState+' t='+Math.round(performance.now()/100)/10;},250);}
</script></body></html>
