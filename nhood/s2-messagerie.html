<title>Messagerie · Séquence 2</title>
<!--
  Messagerie de la séquence 2 (Nhood DE&I). Une seule page, quatre vues :
    ?vue=boite          Outlook navigable (mails et dossiers cliquables) + notification Teams de Noé
    ?vue=teams&r=0|1|2  conversation Teams avec Noé (0 : son message, 1 et 2 : ta réponse et la sienne)
    ?vue=mail           mail pré-rédigé à Grégoire, bouton Envoyer, envoi animé, réponse de Grégoire
  Conçue en 1600 x 900 et mise à l'échelle de la fenêtre (iframe 1200 x 675 dans Genially).

<style>

.tabs span{padding-bottom:8px}

.items{overflow:auto;flex:1}

.it .pv{font-size:13.5px;color:#616161;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.it.unread h4,.it.unread .sj{font-weight:700}
.it.unread .sj{color:#0f6cbd}
.it.new{animation:arrive .6s ease-out}

.empty{padding:60px 30px;text-align:center;color:#616161;font-size:15px;line-height:1.5}
.empty svg{width:90px;height:90px;display:block;margin:0 auto 18px;color:#c8c8c8}
.read{flex:1;padding:24px 34px;overflow:auto;min-width:0}
.read h1{font-size:22px;font-weight:600;margin-bottom:18px}
.from{display:flex;gap:14px;align-items:center}
.from .av{width:44px;height:44px;font-size:14px}
.from h3{font-size:16px;font-weight:600}
.from h3 small{font-weight:400;color:#616161;font-size:14px}
.from p{font-size:13.5px;color:#616161;margin-top:3px}

.from .act b{display:block;color:#0f6cbd;font-weight:600;margin-top:5px}
.body{margin-top:22px;font-size:15.5px;line-height:1.6;max-width:820px}
.body p{margin-bottom:12px}
.body ol{margin:0 0 12px 22px}
.inv{margin-top:20px;border:1px solid #d1d1d1;border-radius:8px;padding:14px 18px;display:flex;gap:18px;align-items:center;max-width:820px}
.cal{width:60px;border:1px solid #d1d1d1;border-radius:6px;overflow:hidden;text-align:center}
.cal em{display:block;background:#c50f1f;color:#fff;font-style:normal;font-size:11px;font-weight:700;padding:3px}
.cal strong{display:block;font-size:23px;padding:3px 0 5px}
.inv h5{font-size:15.5px;font-weight:600}
.inv p{font-size:13.5px;color:#616161;margin-top:3px}
.btns{display:flex;gap:10px;margin-top:9px}

.att{display:inline-flex;gap:10px;align-items:center;border:1px solid #d1d1d1;border-radius:6px;padding:8px 14px;margin-top:6px;font-size:13.5px}

.draft{color:#c50f1f;font-weight:600}

.cbar{display:flex;align-items:center;gap:14px;margin-bottom:16px}

.send svg{width:17px;height:17px}
.send.ready{animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(15,108,189,.55)}50%{box-shadow:0 0 0 12px rgba(15,108,189,0)}}
.send:disabled{opacity:.45;cursor:default;animation:none}
.cbar span{color:#616161;font-size:14px}
.field{display:flex;align-items:center;gap:14px;border-bottom:1px solid #e0e0e0;padding:10px 0;font-size:15px}
.field label{width:60px;color:#616161}
.chip{display:inline-flex;align-items:center;gap:8px;background:#ebebeb;border-radius:14px;padding:3px 12px 3px 3px;font-size:14px}
.chip .av{width:22px;height:22px;font-size:9px}
.cbody{flex:1;padding-top:18px;font-size:15.5px;line-height:1.65;white-space:pre-wrap;max-width:820px}
.caret{display:inline-block;width:2px;height:19px;background:#242424;vertical-align:-3px;animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.hint{position:absolute;right:34px;top:20px;background:#242424;color:#fff;font-size:14px;border-radius:6px;padding:8px 14px;opacity:0;transition:opacity .4s}
.hint.on{opacity:1}
.fly{position:absolute;z-index:40;pointer-events:none;background:#fff;border:1px solid #d1d1d1;border-radius:8px;box-shadow:0 8px 30px rgba(0,0,0,.18);transition:all .9s cubic-bezier(.55,0,.35,1)}

/* toasts */
.toast{position:absolute;z-index:50;width:430px;background:#fff;border-radius:10px;box-shadow:0 12px 40px rgba(0,0,0,.28),0 0 0 1px rgba(0,0,0,.06);padding:14px 16px 16px;transform:translateX(480px);opacity:0;transition:transform .55s cubic-bezier(.2,.9,.25,1),opacity .3s}

.toast .tt{display:flex;align-items:center;gap:9px;font-size:13px;color:#616161;margin-bottom:12px}
.toast .tt .x{margin-left:auto;font-size:16px;color:#8a8a8a}
.toast .tb{display:flex;gap:13px}
.toast .tb .av{width:44px;height:44px;font-size:14px;position:relative}

.toast h4{font-size:15.5px;font-weight:600;margin-bottom:3px}
